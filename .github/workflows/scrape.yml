name: Daily HP Data Scrape

on:
  schedule:
    # 每天 12:00 北京时间
    # GitHub 的 cron 一律按 UTC 计算，北京时间 = UTC + 8，所以这里写 04:00 UTC。
    # 字段含义：分 时 日 月 星期
    #   第 3 位「日」和第 5 位「星期」都用 *，表示不限定 → 即每天执行。
    # 注意：GitHub 的定时任务在高峰期可能延迟几分钟到几十分钟执行，属正常现象。
    - cron: "0 4 * * *"
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

# 同一时间只跑一个抓取任务，避免两次运行互相覆盖数据
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # 固定主版本，避免上游发布不兼容更新时定时任务突然失效
        run: pip install "requests>=2.31,<3"

      - name: Run scraper
        # scraper.py 内部会：抓取 → 写临时文件 → 调用 validate.py 校验 → 通过才原子替换。
        # 校验不通过时会以退出码 1 结束，本步骤随之失败，后续的提交步骤不会执行，
        # 现有数据文件保持原样，网站不受影响。失败会在 Actions 页面标红并邮件通知。
        run: python scripts/scraper.py data/health_data.json

      - name: Validate data file
        # 双重保险：即使前面的校验被绕过，这里再验证一次产出的 JSON 可被正常解析。
        run: |
          python -c "
          import json, sys
          d = json.load(open('data/health_data.json', encoding='utf-8'))
          total = sum(len(d[k]['data']) for k in ('chaosMemory','apocalypticShadow','pureFiction','divergentArbitration'))
          print(f'Total data points: {total}')
          if total == 0:
              print('Total data points is 0, refuse to commit', file=sys.stderr); sys.exit(1)
          "

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # index.html 也要加进来：爬虫会在其中同步更新 health_data.js 的缓存破除查询串，
          # 不加的话线上访问者会一直命中旧缓存，看不到新数据。
          git add data/health_data.json data/health_data.js index.html
          if git diff --cached --quiet; then
            echo "No data changes, skip commit"
          else
            git commit -m "chore: daily HP data update ($(date -u +%F))"
            git push
          fi
